name: Skilling Time Native Live Activity Release v3

on:
  push:
    branches: [native-liveactivity-build-v3]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  IPA_NAME: SkillingTime-v0.3.1-LiveActivity.ipa
  DERIVED_DATA: ${{ github.workspace }}/DerivedData

jobs:
  build-release:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apple runner and SDK inventory
        run: |
          set -euxo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-version

      - name: Hydrate audited source from available Git trees
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, json, os, pathlib, urllib.request, struct, zlib
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; root=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          trees=['7e17a02f889bac6bce5fbad90a4d79c0cbd2515c','aea26d80caa69b534ad61957ae41dfe6077855dd','4655749f353d943ed0da0aed1623f44f8309fe74','9c07908154b1bfeb57c0ac74a10c636f723f5b52','2dac55ae83369534031f34e4a48cfeaf2b21e7a6','0c41bf0091097a117eb95435478f15a06897f4d3','2bfbce8a2b7fdaca0a6eebf1642566213d46e49c','d9b64c8b0130a797072a0d4fa82341d8c8adf068','648180d811b3ecdc3559525f5c90c2e6fa0ae725','cd896c9b37787c8caf58b152ec8d6b1841b71692','74ca2961d09fd6b03c0c0ca235c30573ae6db612','74ce6f4eb5f74f21f80ab1c5a0014c5e101504d5','adf76bb69305b449c9372ba1bada44c7f3f4a115','fda08b4b65e2ce3a2fb15fe2c388f6df839a3765']
          def api(path):
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}{path}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'SkillingTime-native-builder'})
            with urllib.request.urlopen(req) as r: return json.load(r)
          def blob(sha):
            o=api(f'/git/blobs/{sha}'); return base64.b64decode(o['content'])
          written=set()
          for tree_sha in trees:
            try: tree=api(f'/git/trees/{tree_sha}?recursive=1')
            except Exception as e: print(f'warning tree {tree_sha}: {e}'); continue
            for entry in tree.get('tree',[]):
              if entry.get('type')!='blob': continue
              rel=entry.get('path','')
              if not rel or rel.startswith('.bootstrap/') or rel.startswith('.github/workflows/bootstrap-native-ios'): continue
              target=(root/rel).resolve()
              if root not in target.parents: raise RuntimeError(f'unsafe path {rel}')
              try: payload=blob(entry['sha'])
              except Exception as e: print(f'warning blob {entry["sha"]} {rel}: {e}'); continue
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(payload); written.add(rel)
          # If the original PNG blob was not present in the staged Git objects, create a valid local-only build icon.
          icon=root/'SkillingTime/Assets.xcassets/AppIcon.appiconset/SkillingTimeIcon.png'
          if not icon.exists():
            w=h=1024
            raw=b''.join(b'\x00'+bytes([34,85,130,255])*w for _ in range(h))
            def chunk(t,d):
              import binascii
              return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
            png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
            icon.parent.mkdir(parents=True,exist_ok=True); icon.write_bytes(png)
          print(f'written files from Git trees: {len(written)}')
          PY
          find . -type f -not -path './.git/*' | sort | tee /tmp/source-files.txt
          test -f SkillingTime.xcodeproj/project.pbxproj
          test -f SkillingTime.xcodeproj/xcshareddata/xcschemes/SkillingTime.xcscheme
          test -f SkillingTime/Info.plist
          test -f SkillingTimeWidgets/Info.plist
          test -f SkillingTimeWidgets/SkillingTimeLiveActivityWidget.swift

      - name: Validate project graph
        run: |
          set -euxo pipefail
          grep -q 'SkillingTimeWidgets' SkillingTime.xcodeproj/project.pbxproj
          grep -q 'Embed App Extensions' SkillingTime.xcodeproj/project.pbxproj
          grep -R -q 'DynamicIsland' SkillingTimeWidgets
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' SkillingTime/Info.plist | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' SkillingTimeWidgets/Info.plist | grep -qx 'com.apple.widgetkit-extension'
          xcodebuild -project SkillingTime.xcodeproj -list

      - name: Build iPhoneOS app with WidgetKit extension
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$DERIVED_DATA"
          xcodebuild -project SkillingTime.xcodeproj -scheme SkillingTime -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Validate, package and checksum IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/SkillingTime.app"
          EXT="$APP/PlugIns/SkillingTimeWidgets.appex"
          test -d "$APP"; test -d "$EXT"
          test -f "$APP/SkillingTime"; test -f "$EXT/SkillingTimeWidgets"
          plutil -lint "$APP/Info.plist"; plutil -lint "$EXT/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist" | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist" | grep -qx 'com.apple.widgetkit-extension'
          file "$APP/SkillingTime" | grep -q 'Mach-O'; file "$EXT/SkillingTimeWidgets" | grep -q 'Mach-O'
          lipo -info "$APP/SkillingTime" | grep -q arm64; lipo -info "$EXT/SkillingTimeWidgets" | grep -q arm64
          otool -hv "$APP/SkillingTime"; otool -hv "$EXT/SkillingTimeWidgets"
          STAGE="$RUNNER_TEMP/ipa-stage"; rm -rf "$STAGE"; mkdir -p "$STAGE/Payload"; ditto "$APP" "$STAGE/Payload/SkillingTime.app"
          (cd "$STAGE" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload)
          unzip -t "$IPA_NAME"
          unzip -l "$IPA_NAME" | tee ipa-contents.txt
          unzip -l "$IPA_NAME" | grep -F 'Payload/SkillingTime.app/PlugIns/SkillingTimeWidgets.appex/'
          unzip -l "$IPA_NAME" | grep -F 'Payload/SkillingTime.app/PlugIns/SkillingTimeWidgets.appex/SkillingTimeWidgets'
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"

      - name: Upload validated IPA
        uses: actions/upload-artifact@v4
        with:
          name: SkillingTime-v0.3.1-LiveActivity
          path: |
            SkillingTime-v0.3.1-LiveActivity.ipa
            SkillingTime-v0.3.1-LiveActivity.ipa.sha256
            ipa-contents.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SkillingTime-native-build-diagnostics-v3
          path: |
            ${{ runner.temp }}/xcodebuild.log
            /tmp/source-files.txt
          if-no-files-found: ignore
          retention-days: 14
