name: Build Skilling Time iPhoneOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Test, build, and validate Awakening IPA
    runs-on: macos-26
    timeout-minutes: 45

    env:
      IPA_NAME: SkillingTime-v0.5.1-The-Awakening.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Apple build environment
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk watchos --show-sdk-path
          xcrun --sdk watchos --show-sdk-version
          xcrun simctl list devices available

      - name: Validate Xcode project and scheme
        run: |
          set -euxo pipefail
          test -f SkillingTime.xcodeproj/project.pbxproj
          test -f SkillingTime.xcodeproj/xcshareddata/xcschemes/SkillingTime.xcscheme
          test -f SkillingTime.xcodeproj/xcshareddata/xcschemes/SkillingTimeWatch.xcscheme
          test -d SkillingTimeWatch
          grep -Fq 'com.apple.product-type.application.watchapp2' SkillingTime.xcodeproj/project.pbxproj
          grep -Fq 'Embed Watch Content' SkillingTime.xcodeproj/project.pbxproj
          grep -Fq 'WatchConnectivity.framework' SkillingTime.xcodeproj/project.pbxproj
          grep -Fq 'WKCompanionAppBundleIdentifier' SkillingTimeWatch/Info.plist
          grep -Fq 'WatchStateSnapshot' SkillingTime/Shared/SkillingTimeWatchModels.swift
          grep -Fq 'WatchSessionCommand' SkillingTime/Shared/SkillingTimeWatchModels.swift
          grep -Fq 'ActivityConfiguration(for: SkillingTimeActivityAttributes.self)' \
            SkillingTimeWidgets/SkillingTimeLiveActivityWidget.swift
          grep -Fq 'SkillingTimeLiveActivityWidget()' \
            SkillingTimeWidgets/SkillingTimeWidgetBundle.swift
          grep -Fq 'SkillingTimeWidgets' SkillingTime.xcodeproj/project.pbxproj
          grep -Fq 'Embed App Extensions' SkillingTime.xcodeproj/project.pbxproj
          grep -Fq 'NSSupportsLiveActivities' SkillingTime/Info.plist
          xcodebuild -project SkillingTime.xcodeproj -list
          xcodebuild \
            -project SkillingTime.xcodeproj \
            -scheme SkillingTime \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -showBuildSettings | tee "$RUNNER_TEMP/build-settings.txt"
          xcodebuild \
            -project SkillingTime.xcodeproj \
            -scheme SkillingTimeWatch \
            -configuration Release \
            -sdk watchsimulator \
            -showBuildSettings | tee "$RUNNER_TEMP/watch-build-settings.txt"

      - name: Run progression, Character, Questboard, motion, and migration tests
        run: |
          set -euxo pipefail
          DEVICE_ID=$(python3 - <<'PY'
          import json
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone simulator was found")
          candidates.sort(reverse=True)
          print(candidates[0][2])
          PY
          )
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          TEST_DERIVED_DATA="$RUNNER_TEMP/SkillingTimeTestDerivedData"
          xcodebuild \
            -project SkillingTime.xcodeproj \
            -scheme SkillingTime \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$TEST_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test | tee "$RUNNER_TEMP/xcodebuild-tests.log"

      - name: Build app and WidgetKit extension without distribution signing
        run: |
          set -euxo pipefail
          DERIVED_DATA="$RUNNER_TEMP/SkillingTimeDerivedData"
          xcodebuild \
            -project SkillingTime.xcodeproj \
            -scheme SkillingTime \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/SkillingTime.app"
          EXT="$APP/PlugIns/SkillingTimeWidgets.appex"
          MAIN_EXEC="$APP/SkillingTime"
          EXT_EXEC="$EXT/SkillingTimeWidgets"

          test -d "$APP" || { echo 'ERROR: SkillingTime.app was not produced'; exit 1; }
          test -d "$EXT" || { echo 'ERROR: SkillingTimeWidgets.appex is missing'; find "$APP" -maxdepth 4 -print; exit 1; }
          test -x "$MAIN_EXEC" || { echo 'ERROR: main executable is missing'; exit 1; }
          test -x "$EXT_EXEC" || { echo 'ERROR: widget executable is missing'; exit 1; }

          plutil -lint "$APP/Info.plist"
          plutil -lint "$EXT/Info.plist"

          LIVE_VALUE=$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")
          test "$LIVE_VALUE" = "true" || { echo "ERROR: NSSupportsLiveActivities is not true: $LIVE_VALUE"; exit 1; }

          LAUNCH_COLOR=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$APP/Info.plist")
          LAUNCH_IMAGE=$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIImageName' "$APP/Info.plist")
          test "$LAUNCH_COLOR" = "LaunchBackground" || { echo "ERROR: unexpected launch color: $LAUNCH_COLOR"; exit 1; }
          test "$LAUNCH_IMAGE" = "LaunchMark" || { echo "ERROR: unexpected launch image: $LAUNCH_IMAGE"; exit 1; }

          EXT_POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")
          test "$EXT_POINT" = "com.apple.widgetkit-extension" || { echo "ERROR: unexpected extension point: $EXT_POINT"; exit 1; }

          MAIN_FILE=$(file "$MAIN_EXEC")
          EXT_FILE=$(file "$EXT_EXEC")
          echo "$MAIN_FILE"
          echo "$EXT_FILE"
          echo "$MAIN_FILE" | grep -q 'Mach-O' || { echo 'ERROR: main executable is not Mach-O'; exit 1; }
          echo "$EXT_FILE" | grep -q 'Mach-O' || { echo 'ERROR: widget executable is not Mach-O'; exit 1; }

          MAIN_ARCHS=$(lipo -archs "$MAIN_EXEC")
          EXT_ARCHS=$(lipo -archs "$EXT_EXEC")
          echo "Main architectures: $MAIN_ARCHS"
          echo "Widget architectures: $EXT_ARCHS"
          echo "$MAIN_ARCHS" | grep -qw arm64 || { echo 'ERROR: main executable lacks arm64'; exit 1; }
          echo "$EXT_ARCHS" | grep -qw arm64 || { echo 'ERROR: widget executable lacks arm64'; exit 1; }

          otool -hv "$MAIN_EXEC"
          otool -hv "$EXT_EXEC"

          {
            echo "App: $APP"
            echo "Extension: $EXT"
            echo "NSSupportsLiveActivities: $LIVE_VALUE"
            echo "Launch color asset: $LAUNCH_COLOR"
            echo "Launch image asset: $LAUNCH_IMAGE"
            echo "NSExtensionPointIdentifier: $EXT_POINT"
            echo "Main executable: $MAIN_FILE"
            echo "Widget executable: $EXT_FILE"
            echo "Main architectures: $MAIN_ARCHS"
            echo "Widget architectures: $EXT_ARCHS"
          } | tee "$RUNNER_TEMP/bundle-validation.txt"

          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Build Watch application without distribution signing
        run: |
          set -euxo pipefail
          WATCH_DERIVED_DATA="$RUNNER_TEMP/SkillingTimeWatchDerivedData"
          xcodebuild \
            -project SkillingTime.xcodeproj \
            -scheme SkillingTimeWatch \
            -configuration Release \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$WATCH_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee "$RUNNER_TEMP/xcodebuild-watch.log"

          WATCH_APP="$WATCH_DERIVED_DATA/Build/Products/Release-watchsimulator/SkillingTimeWatch.app"
          WATCH_EXEC="$WATCH_APP/SkillingTimeWatch"
          test -d "$WATCH_APP" || {
            echo 'ERROR: SkillingTimeWatch.app was not produced'
            find "$WATCH_DERIVED_DATA/Build/Products" -maxdepth 4 -print
            exit 1
          }
          test -x "$WATCH_EXEC" || { echo 'ERROR: Watch executable is missing'; exit 1; }
          plutil -lint "$WATCH_APP/Info.plist"
          WATCH_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WATCH_APP/Info.plist")
          WATCH_COMPANION_ID=$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCH_APP/Info.plist")
          test "$WATCH_BUNDLE_ID" = 'com.projectskillbook.app.watchkitapp'
          test "$WATCH_COMPANION_ID" = 'com.projectskillbook.app'
          WATCH_FILE=$(file "$WATCH_EXEC")
          echo "$WATCH_FILE"
          echo "$WATCH_FILE" | grep -q 'Mach-O' || { echo 'ERROR: Watch executable is not Mach-O'; exit 1; }
          WATCH_ARCHS=$(lipo -archs "$WATCH_EXEC")
          echo "Watch architectures: $WATCH_ARCHS"
          echo "$WATCH_ARCHS" | grep -qw arm64 || { echo 'ERROR: Watch executable lacks arm64'; exit 1; }

          {
            echo "Watch app: $WATCH_APP"
            echo "Watch bundle identifier: $WATCH_BUNDLE_ID"
            echo "Watch companion identifier: $WATCH_COMPANION_ID"
            echo "Watch executable: $WATCH_FILE"
            echo "Watch architectures: $WATCH_ARCHS"
          } | tee "$RUNNER_TEMP/watch-validation.txt"

          echo "WATCH_APP_PATH=$WATCH_APP" >> "$GITHUB_ENV"

      - name: Package standard unsigned IPA
        run: |
          set -euxo pipefail
          PACKAGE="$RUNNER_TEMP/package"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/Payload"
          ditto "$APP_PATH" "$PACKAGE/Payload/SkillingTime.app"
          cd "$PACKAGE"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload

      - name: Validate final IPA archive
        run: |
          set -euxo pipefail
          unzip -t "$IPA_NAME"
          unzip -l "$IPA_NAME" | tee "$RUNNER_TEMP/ipa-contents.txt"

          grep -Fq 'Payload/SkillingTime.app/' "$RUNNER_TEMP/ipa-contents.txt" || {
            echo 'ERROR: IPA does not contain Payload/SkillingTime.app'; exit 1;
          }
          grep -Fq 'Payload/SkillingTime.app/PlugIns/SkillingTimeWidgets.appex/' "$RUNNER_TEMP/ipa-contents.txt" || {
            echo 'ERROR: IPA does not contain the WidgetKit extension'; exit 1;
          }
          grep -Fq 'Payload/SkillingTime.app/PlugIns/SkillingTimeWidgets.appex/SkillingTimeWidgets' "$RUNNER_TEMP/ipa-contents.txt" || {
            echo 'ERROR: IPA does not contain the WidgetKit extension executable'; exit 1;
          }
          grep -Fq 'Payload/SkillingTime.app/Watch/SkillingTimeWatch.app/' "$RUNNER_TEMP/ipa-contents.txt" || {
            echo 'ERROR: IPA does not contain the embedded Watch application'; exit 1;
          }

          rm -rf "$RUNNER_TEMP/ipa-inspect"
          mkdir -p "$RUNNER_TEMP/ipa-inspect"
          unzip -q "$IPA_NAME" -d "$RUNNER_TEMP/ipa-inspect"
          IPA_APP="$RUNNER_TEMP/ipa-inspect/Payload/SkillingTime.app"
          IPA_EXT="$IPA_APP/PlugIns/SkillingTimeWidgets.appex"
          IPA_WATCH="$IPA_APP/Watch/SkillingTimeWatch.app"

          plutil -lint "$IPA_APP/Info.plist"
          plutil -lint "$IPA_EXT/Info.plist"
          plutil -lint "$IPA_WATCH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$IPA_APP/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIColorName' "$IPA_APP/Info.plist")" = "LaunchBackground"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UILaunchScreen:UIImageName' "$IPA_APP/Info.plist")" = "LaunchMark"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$IPA_EXT/Info.plist")" = "com.apple.widgetkit-extension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$IPA_WATCH/Info.plist")" = "com.projectskillbook.app.watchkitapp"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$IPA_WATCH/Info.plist")" = "com.projectskillbook.app"
          file "$IPA_APP/SkillingTime" | grep -q 'Mach-O'
          file "$IPA_EXT/SkillingTimeWidgets" | grep -q 'Mach-O'
          file "$IPA_WATCH/SkillingTimeWatch" | grep -q 'Mach-O'
          lipo -archs "$IPA_APP/SkillingTime" | grep -qw arm64
          lipo -archs "$IPA_EXT/SkillingTimeWidgets" | grep -qw arm64
          lipo -archs "$IPA_WATCH/SkillingTimeWatch" | grep -qw arm64

          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          cat "$RUNNER_TEMP/bundle-validation.txt" "$RUNNER_TEMP/ipa-contents.txt" > SkillingTime-v0.5.1-The-Awakening-validation.txt

      - name: Upload validated IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkillingTime-v0.5.1-The-Awakening
          path: |
            SkillingTime-v0.5.1-The-Awakening.ipa
            SkillingTime-v0.5.1-The-Awakening.ipa.sha256
            SkillingTime-v0.5.1-The-Awakening-validation.txt
            ${{ runner.temp }}/watch-validation.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SkillingTime-build-diagnostics
          path: |
            ${{ runner.temp }}/xcodebuild-tests.log
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcodebuild-watch.log
            ${{ runner.temp }}/build-settings.txt
            ${{ runner.temp }}/watch-build-settings.txt
            ${{ runner.temp }}/bundle-validation.txt
            ${{ runner.temp }}/watch-validation.txt
            ${{ runner.temp }}/ipa-contents.txt
          if-no-files-found: ignore
          retention-days: 7
