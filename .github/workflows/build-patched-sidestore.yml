name: Build patched SideStore Watch support

on:
  workflow_dispatch:
  push:
    branches:
      - agent/sidestore-watch-support
    paths:
      - 'tools/sidestore-watch-support/**'
      - '.github/workflows/build-patched-sidestore.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout patch harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout pinned SideStore
        uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: e3f3a5b941ce657723a4939c89f2eea63bcfe263
          path: upstream
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned AltSign revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C upstream/Dependencies/AltSign rev-parse HEAD)"
          expected="c0031f042a388a3a2f16549f14c04417a2976765"
          test "$actual" = "$expected"

      - name: Apply Apple Watch bundle graph patch
        shell: bash
        run: |
          set -euo pipefail
          python3 harness/tools/sidestore-watch-support/apply_watch_support.py upstream
          python3 harness/tools/sidestore-watch-support/fix_compile_v2.py upstream

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream diff --check
          git -C upstream/Dependencies/AltSign diff --check
          git -C upstream diff -- SideStore/Core/Operations/PipelineOperations
          git -C upstream/Dependencies/AltSign diff -- Sources/Model/ALTApplication.swift Sources/Model/ALTDevice.swift Sources/ALTSigner.swift

      - name: Setup Xcode 26.2
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.2'

      - name: Install build dependencies
        run: brew install ldid xcbeautify

      - name: Build patched SideStore
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/workflow.py build 2>&1 | tee ../sidestore-watch-build.log

      - name: Verify IPA
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/SideStore.ipa
          unzip -t upstream/SideStore.ipa | tee sidestore-watch-ipa-test.log
          shasum -a 256 upstream/SideStore.ipa | tee sidestore-watch-ipa.sha256

      - name: Upload patched SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-Watch-Support-Experimental
          path: |
            upstream/SideStore.ipa
            sidestore-watch-build.log
            sidestore-watch-ipa-test.log
            sidestore-watch-ipa.sha256
          if-no-files-found: error
